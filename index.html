                <p><span>Studio:</span> ${data.studio}</p>
                ${data.distributor ? `<p><span>Distributor:</span> ${data.distributor}</p>` : ''}
                ${data.phase && data.phase !== 'N/A' ? `<p><span>Phase / Universe:</span> ${data.phase}</p>` : ''}
            `;
            modalOverview.textContent = data.overview;
            modalHighlights.innerHTML = data.highlights.map(h => `<li>${h}</li>`).join('');

            // Handle trailer section
            if (data.trailer && data.trailer.youtubeId) {
                trailersSection.style.display = 'block';
                const embedUrl = `https://www.youtube.com/embed/${data.trailer.youtubeId}?rel=0&modestbranding=1&enablejsapi=1`;
                modalTrailers.innerHTML = `
                    <div class="video-container">
                        <iframe src="${embedUrl}" title="${data.title} Official Trailer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
                    </div>
                    <div>
                        <a href="${data.trailer.url}" target="_blank" rel="noopener noreferrer" class="watch-yt-btn">
                            ▶ Watch Trailer on YouTube
                        </a>
                    </div>
                `;
            } else {
                trailersSection.style.display = 'none';
                modalTrailers.innerHTML = '';
            }

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        const hideModal = () => {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            modalTrailers.innerHTML = '';
        };

        // Event delegation for movie boxes
        moviesGrid.addEventListener('click', (e) => {
            const box = e.target.closest('.movie-box');
            if (box) {
                const movieId = box.getAttribute('data-id');
                openModal(movieId);
            }
        });

        closeModal.addEventListener('click', hideModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) hideModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) hideModal();
        });

        // Header scroll effect
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // Preloader smooth exit
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            setTimeout(() => {
                preloader.classList.add('fade-out');
                setTimeout(() => {
                    preloader.remove();
                    initScrollReveal();
                }, 800);
            }, 500);
        });

        // Scroll Reveal Logic
        const initScrollReveal = () => {
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => {
                            entry.target.classList.add('reveal-active');
                        }, index * 40);
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            const movieBoxes = document.querySelectorAll('.movie-box');
            movieBoxes.forEach(box => {
                revealObserver.observe(box);
            });
        };
    </script>

</body>

</html>
