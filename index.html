        const trailersSection = document.getElementById('trailersSection');
        const modalTrailers = document.getElementById('modalTrailers');

        // Render movie cards dynamically in Hype/Anticipation order (keys order)
        const renderGrid = () => {
            moviesGrid.innerHTML = Object.keys(movieData).map(key => {
                const movie = movieData[key];
                return `
                    <div class="movie-box" id="${key}Box" data-key="${key}">
                        <div class="movie-poster">
                            <img src="${movie.poster}" alt="${movie.title} Poster" class="poster-image" loading="lazy">
                        </div>
                        <div class="movie-info">
                            <h2 class="movie-title">${movie.title}</h2>
                            <p class="release-date">Release Date: ${movie.release}</p>
                        </div>
                    </div>
                `;
            }).join('');
        };

        renderGrid();

        const openModal = (movieKey) => {
            const data = movieData[movieKey];
            if (!data) return;

            modalTitle.textContent = data.title;
            modalMeta.innerHTML = `
                <p><span>Release:</span> ${data.release}</p>
                <p><span>Studio:</span> ${data.studio}</p>
                ${data.distributor ? `<p><span>Distributor:</span> ${data.distributor}</p>` : ''}
                ${data.phase && data.phase !== 'N/A' ? `<p><span>MCU Phase / Universe:</span> ${data.phase}</p>` : ''}
            `;
            modalOverview.textContent = data.overview;
            modalHighlights.innerHTML = data.highlights.map(h => `<li>${h}</li>`).join('');

            // Handle trailers (supports multiple trailer embeds per movie)
            if (data.trailers && data.trailers.length > 0) {
                trailersSection.style.display = 'block';
                modalTrailers.innerHTML = data.trailers.map((url, index) => {
                    const videoUrl = new URL(url);
                    videoUrl.searchParams.set('modestbranding', '1');
                    videoUrl.searchParams.set('rel', '0');
                    videoUrl.searchParams.set('iv_load_policy', '3');
                    videoUrl.searchParams.set('enablejsapi', '1');

                    // Autoplay first video for Avengers as in original site
                    if (movieKey === 'avengers' && index === 0) {
                        videoUrl.searchParams.set('autoplay', '1');
                    }

                    // Extract YouTube video ID for direct watch link
                    const embedMatch = url.match(/\/embed\/([a-zA-Z0-9_-]+)/);
                    const ytId = embedMatch ? embedMatch[1] : '';
                    const watchUrl = ytId ? `https://www.youtube.com/watch?v=${ytId}` : url;

                    return `
                        <div class="video-container">
                            <iframe src="${videoUrl.toString()}" title="${data.title} Trailer ${index + 1}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <a href="${watchUrl}" target="_blank" rel="noopener noreferrer" class="watch-yt-btn">
                                ▶ Watch Trailer on YouTube
                            </a>
                        </div>
                    `;
                }).join('');
            } else {
                trailersSection.style.display = 'none';
                modalTrailers.innerHTML = '';
            }

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        const hideModal = () => {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            modalTrailers.innerHTML = '';
        };

        // Event delegation for movie cards
        moviesGrid.addEventListener('click', (e) => {
            const box = e.target.closest('.movie-box');
            if (box) {
                const key = box.getAttribute('data-key');
                openModal(key);
            }
        });

        closeModal.addEventListener('click', hideModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) hideModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) hideModal();
        });

        // Header scroll effect
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // Preloader smooth exit
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            setTimeout(() => {
                preloader.classList.add('fade-out');
                setTimeout(() => {
                    preloader.remove();
                    initScrollReveal();
                }, 800);
            }, 500);
        });

        // Scroll Reveal Logic
        const initScrollReveal = () => {
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => {
                            entry.target.classList.add('reveal-active');
                        }, index * 40);
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            const movieBoxes = document.querySelectorAll('.movie-box');
            movieBoxes.forEach(box => {
                revealObserver.observe(box);
            });
        };
    </script>

</body>
